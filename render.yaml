# Render Blueprint for the Loot Run backend. Connect this repo on Render with
# "New > Blueprint" and it reads this file automatically - no manual field
# entry needed, nothing here is required to deploy.
#
# Socket.IO is already the backend's transport (Flask-SocketIO); this just
# deploys what's there. NFC_SECRET and PRESAGE_API_KEY are both genuinely
# optional in server/app.py (os.environ.get(..., "")) - NFC_SECRET blank
# just skips signing/verifying physical loot tags, PRESAGE_API_KEY only
# flips a cosmetic /health flag and has no live code path. Deliberately left
# out of this blueprint so Render doesn't prompt for them as required
# secrets; add either one later in the dashboard if you want them.
services:
  - type: web
    name: lootrun-server
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt && python download_assets.py
    startCommand: gunicorn -k eventlet -w 1 -b 0.0.0.0:$PORT app:app
    # -w 1 only: game state (cars, sessions, alamo_challenges in app.py)
    # lives in plain in-process dicts with no shared store. Multiple workers
    # or instances would each run a disconnected copy of the game.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Comma-separated; drives both Flask-CORS and Socket.IO's own CORS
      # check. Update to your real Vercel domain(s) before going live.
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5173
      # Defaults to "1" (dev mode) in app.py if unset, which exposes
      # admin/dev socket events (skip/reset/sim-input) to any client with no
      # auth. Set to 0 for a public deploy; leave 1 only if you want those
      # dev tools live (e.g. at a demo table).
      - key: RIVERWALK_DEV_MODE
        value: "0"
