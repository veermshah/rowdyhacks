# Riverwalk Presage server + Caddy (automatic HTTPS) for a single VM (Vultr).
# Started by vultr-setup.sh; DOMAIN comes from deploy/.env (e.g. 203-0-113-5.sslip.io).
services:
  presage:
    build: ..
    env_file: ../.env          # PRESAGE_API_KEY, CORS_ORIGINS, RIVERWALK_DEV_MODE
    environment:
      PORT: "5000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # keeps the HTTPS certificate across restarts
      - caddy_config:/config
    depends_on:
      - presage

volumes:
  caddy_data:
  caddy_config:
